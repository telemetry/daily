name: Set Focus

# Two dashboard actions land here as prefilled issues (only Terry's are honored):
#   "focus: owner/repo"            — put that repo at the top of the queue
#   "queue: o/r1,o/r2,..."         — replace the queue order (from drag-and-drop)
# The workflow updates focus.json, retitles the standing nudge issue, closes the
# request, and re-runs daily.yml so the dashboard reflects the change.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  set-focus:
    if: (startsWith(github.event.issue.title, 'focus:') || startsWith(github.event.issue.title, 'queue:')) && github.event.issue.user.login == 'telemetry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update focus.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          READ_TOKEN: ${{ secrets.DAILY_TOKEN }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          NUM: ${{ github.event.issue.number }}
        run: |
          set -e

          REPO_LIST_RE='^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+(,[A-Za-z0-9._-]+/[A-Za-z0-9._-]+)*$'

          if [[ "$TITLE" == queue:* ]]; then
            # The list rides in the title for short queues, or (because issue
            # titles cap at 256 chars) as the first list-shaped line of the body
            LIST=$(echo "$TITLE" | sed 's/^queue:[[:space:]]*//' | tr -d '[:space:]')
            if ! echo "$LIST" | grep -Eq "$REPO_LIST_RE"; then
              LIST=$(echo "$BODY" | tr -d ' \r' | grep -E "$REPO_LIST_RE" | head -1)
            fi
            if [ -z "$LIST" ]; then
              gh issue close "$NUM" --comment "Couldn't find a repo list in the title or body — expected \`owner/repo,owner/repo,...\`. Queue unchanged."
              exit 0
            fi
            # Rebuild the queue in the requested order, keeping known goals
            echo "$LIST" | jq -R 'split(",")' > /tmp/order.json
            jq --slurpfile order /tmp/order.json '. as $f |
              {queue: [$order[0][] | . as $r |
                (first($f.queue[] | select(.repo == $r)) // {repo: $r, goal: "Ship it"})]}' \
              focus.json > /tmp/focus.json && mv /tmp/focus.json focus.json
            SUMMARY="Queue is now: $LIST"
          else
            NEW_REPO=$(echo "$TITLE" | sed 's/^focus:[[:space:]]*//' | tr -d '[:space:]')
            if ! echo "$NEW_REPO" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
              gh issue close "$NUM" --comment "Couldn't parse a repo out of the title — expected \`focus: owner/repo\`. Focus unchanged."
              exit 0
            fi
            if ! GH_TOKEN="$READ_TOKEN" gh api "repos/$NEW_REPO" --jq .full_name > /dev/null; then
              gh issue close "$NUM" --comment "\`$NEW_REPO\` isn't readable with DAILY_TOKEN — focus unchanged."
              exit 0
            fi
            # Goal: explicit "goal:" line in the body > existing queue entry > default
            GOAL_BODY=$(echo "$BODY" | grep -i '^goal:' | head -1 | sed 's/^[Gg]oal:[[:space:]]*//')
            EXISTING_GOAL=$(jq -r --arg r "$NEW_REPO" 'first(.queue[] | select(.repo == $r).goal) // empty' focus.json)
            GOAL="${GOAL_BODY:-${EXISTING_GOAL:-Ship it}}"
            jq --arg r "$NEW_REPO" --arg g "$GOAL" \
              '{queue: ([{repo: $r, goal: $g}] + [.queue[] | select(.repo != $r)])}' \
              focus.json > /tmp/focus.json && mv /tmp/focus.json focus.json
            SUMMARY="Focus is now **$NEW_REPO** — $GOAL"
          fi

          TOP=$(jq -r '.queue[0].repo' focus.json)

          git config user.name "telemetry"
          git config user.email "telemetry@users.noreply.github.com"
          git add focus.json
          git diff --staged --quiet || git commit -m "focus queue -> $TOP first"
          git push

          # Keep the standing nudge issue's title pointing at the new top
          NUDGE=$(gh issue list --state open --search "in:title Focus:" --json number --jq "[.[] | select(.number != ${NUM})][0].number // empty")
          if [ -n "$NUDGE" ]; then
            gh issue edit "$NUDGE" --title "Focus: ${TOP##*/}"
          fi

          gh issue close "$NUM" --comment "🎯 $SUMMARY"

          # Rebuild the dashboard so the change shows immediately
          gh workflow run daily.yml
