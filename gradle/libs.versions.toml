# Pinned for the androidx A2UI preview. material3-a2ui 1.0.0-alpha02 is built
# against Compose 1.13.0-alpha03 and Material 3 1.5.0-alpha28, so those are the
# floors here; Gradle will not resolve lower.
[versions]
agp = "8.13.0"
kotlin = "2.2.21"
coroutines = "1.10.2"
activityCompose = "1.11.0"
lifecycle = "2.9.4"
compose = "1.13.0-alpha03"
material3 = "1.5.0-alpha28"
a2ui = "1.0.0-alpha02"
material3A2ui = "1.0.0-alpha02"

[libraries]
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-material3-a2ui = { group = "androidx.compose.material3", name = "material3-a2ui", version.ref = "material3A2ui" }
a2ui-model = { group = "androidx.a2ui", name = "a2ui-model", version.ref = "a2ui" }
a2ui-engine = { group = "androidx.a2ui", name = "a2ui-engine", version.ref = "a2ui" }
a2ui-compose-runtime = { group = "androidx.a2ui.compose", name = "compose-runtime", version.ref = "a2ui" }
a2ui-compose-ui = { group = "androidx.a2ui.compose", name = "compose-ui", version.ref = "a2ui" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
