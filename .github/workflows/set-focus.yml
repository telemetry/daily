name: Set Focus

# Ticking a 🎯 on the dashboard opens a prefilled issue titled "focus: owner/repo".
# This workflow (only for issues opened by Terry) writes that into focus.json,
# retitles the open nudge issue, closes the request, and refreshes the dashboard.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  set-focus:
    if: startsWith(github.event.issue.title, 'focus:') && github.event.issue.user.login == 'telemetry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update focus.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          READ_TOKEN: ${{ secrets.DAILY_TOKEN }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          NUM: ${{ github.event.issue.number }}
        run: |
          set -e
          NEW_REPO=$(echo "$TITLE" | sed 's/^focus:[[:space:]]*//' | tr -d '[:space:]')

          if ! echo "$NEW_REPO" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
            gh issue close "$NUM" --comment "Couldn't parse a repo out of the title — expected \`focus: owner/repo\`. Focus unchanged."
            exit 0
          fi

          if ! GH_TOKEN="$READ_TOKEN" gh api "repos/$NEW_REPO" --jq .full_name > /dev/null; then
            gh issue close "$NUM" --comment "\`$NEW_REPO\` isn't readable with DAILY_TOKEN — focus unchanged."
            exit 0
          fi

          # Optional "goal:" and "next:" lines in the issue body override focus.json
          GOAL=$(echo "$BODY" | grep -i '^goal:' | head -1 | sed 's/^[Gg]oal:[[:space:]]*//')
          NEXT=$(echo "$BODY" | grep -i '^next:' | head -1 | sed 's/^[Nn]ext:[[:space:]]*//')
          [ -z "$GOAL" ] && GOAL=$(jq -r '.goal' focus.json)
          [ -z "$NEXT" ] && NEXT=$(jq -r '.next' focus.json)

          jq --arg r "$NEW_REPO" --arg g "$GOAL" --arg n "$NEXT" \
            '.repo = $r | .goal = $g | .next = $n' focus.json > tmp.json && mv tmp.json focus.json

          git config user.name "telemetry"
          git config user.email "telemetry@users.noreply.github.com"
          git add focus.json
          git diff --staged --quiet || git commit -m "focus -> $NEW_REPO"
          git push

          # Keep the standing nudge issue's title in sync with the new focus
          NUDGE=$(gh issue list --state open --search "in:title Focus:" --json number --jq "[.[] | select(.number != ${NUM})][0].number // empty")
          if [ -n "$NUDGE" ]; then
            gh issue edit "$NUDGE" --title "Focus: ${NEW_REPO##*/}"
          fi

          gh issue close "$NUM" --comment "🎯 Focus is now **${NEW_REPO}** — ${GOAL}"

          # Rebuild the dashboard so the new focus shows immediately
          gh workflow run daily.yml
