name: Daily Activity Check

on:
  schedule:
    - cron: '42 8 * * *'  # 8:42am UTC (~6:42pm AEST)
  workflow_dispatch:       # manual trigger

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate daily report and portfolio
        id: report
        env:
          GH_TOKEN: ${{ secrets.DAILY_TOKEN }}
        run: |
          set -e

          # Fail loudly if the token is missing/expired instead of logging "? days" forever
          if ! gh api user --jq .login > /dev/null; then
            echo "::error::DAILY_TOKEN is missing, expired, or invalid. Create a classic PAT with 'repo' scope and run: gh secret set DAILY_TOKEN -R telemetry/daily"
            exit 1
          fi

          TODAY=$(date -u +%Y-%m-%d)
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)

          mkdir -p "logs/$YEAR"
          LOG="logs/$YEAR/$MONTH.md"

          # Project registry: owner/repo|description|category
          PROJECTS=(
            "telemetry/GlyphSketch|iPad app for sketching and prototyping typeface glyphs|Apps"
            "telemetry/FlightTracker|Cinematic ambient tvOS app — live flights on a satellite map|Apps"
            "telemetry/addend|Daily accountability menu bar app|Apps"
            "telemetry/GlyphsTemplateManager|Glyphs.app template plugin|Apps"
            "Recreational-Math/roadie|Music curation — a tote bag full of albums|Apps"
            "Recreational-Math/AnyTwo|Any-two-cards poker widget|Apps"
            "Recreational-Math/BiOS|Biorhythms|Apps"
            "Recreational-Math/BiOSCharts|Biorhythm charts|Apps"
            "telemetry/recently|What have you enjoyed recently|Web"
            "telemetry/newRecently|Recently — next version|Web"
            "telemetry/Terrence|Personal portfolio — terrygillespie.com|Web"
            "telemetry/smallVictories|Photography portfolio — smallvictories.com.au|Web"
            "telemetry/sloooow-site|Sloooow — slow down and focus|Web"
            "telemetry/duodecimal|Base-12 clock|Web"
            "telemetry/linkterry|Link list|Web"
            "telemetry/airfresh|Air quality tracker|Web"
            "Recreational-Math/roadiemusic|Roadie website|Web"
            "Recreational-Math/Recreational-Math.github.io|recreationalmath.com.au — club site|Web"
            "telemetry/concentric|Central clock face|Experiments"
            "telemetry/texasStackEm|Card game|Experiments"
            "telemetry/p5|p5.js sketch experiments with type|Experiments"
            "telemetry/prints|Prints by tezjnr|Creative"
            "telemetry/photographie|Postcards from Paris|Creative"
            "telemetry/build-day|Build Day ambient animations and stills|Creative"
            "telemetry/claude-sync|Memory + skills sync between Macs|Meta"
            "telemetry/daily|This repo — daily activity tracker|Meta"
          )

          # Focus queue lives in focus.json as an ordered list — the TOP item is
          # the one the nudge watches. Reorder by dragging on the dashboard or
          # ticking a 🎯 (both go through set-focus.yml), or edit the file.
          FOCUS_REPO=$(jq -r '.queue[0].repo' focus.json)
          FOCUS_GOAL=$(jq -r '.queue[0].goal' focus.json)
          FOCUS_NEXT=$(jq -r '.queue[1].repo // "—"' focus.json)
          FOCUS_NEXT="${FOCUS_NEXT##*/}"
          FOCUS_DAYS="?"
          FOCUS_COMMITS=0
          MIN_DAYS="?"

          # Collect data for each project
          ENTRY="## $TODAY"$'\n'
          ACTIVE=0
          FAILED=0
          TOTAL=${#PROJECTS[@]}
          PROJECT_DATA=""

          for PROJECT in "${PROJECTS[@]}"; do
            IFS='|' read -r FULL DESC CATEGORY <<< "$PROJECT"
            OWNER="${FULL%%/*}"
            REPO="${FULL##*/}"

            COMMITS=$(gh api "repos/$FULL/commits?since=${TODAY}T00:00:00Z&per_page=100" \
              --jq 'length' 2>/dev/null || echo "0")

            LAST=$(gh api "repos/$FULL/commits?per_page=1" \
              --jq '.[0].commit.committer.date // "unknown"' 2>/dev/null || echo "unknown")
            LAST_SHORT=$(echo "$LAST" | cut -c1-10)

            LAST_MSG=$(gh api "repos/$FULL/commits?per_page=1" \
              --jq '.[0].commit.message // ""' 2>/dev/null | head -1 || echo "")

            if [ "$LAST_SHORT" != "unknown" ]; then
              LAST_TS=$(date -d "$LAST_SHORT" +%s 2>/dev/null || echo "0")
              TODAY_TS=$(date -d "$TODAY" +%s 2>/dev/null || echo "0")
              if [ "$LAST_TS" != "0" ] && [ "$TODAY_TS" != "0" ]; then
                DAYS_AGO=$(( (TODAY_TS - LAST_TS) / 86400 ))
              else
                DAYS_AGO="?"
              fi
            else
              DAYS_AGO="?"
              FAILED=$((FAILED + 1))
            fi

            # Status badge
            if [ "$COMMITS" -gt 0 ] 2>/dev/null; then
              STATUS="active"
              ACTIVE=$((ACTIVE + 1))
              ENTRY+="- **$FULL**: $COMMITS commit(s)"$'\n'
            elif [ "$DAYS_AGO" != "?" ] && [ "$DAYS_AGO" -le 7 ]; then
              STATUS="recent"
              ENTRY+="- $FULL: $DAYS_AGO days"$'\n'
            elif [ "$DAYS_AGO" != "?" ] && [ "$DAYS_AGO" -le 30 ]; then
              STATUS="idle"
              ENTRY+="- $FULL: $DAYS_AGO days"$'\n'
            else
              STATUS="stale"
              ENTRY+="- ~$FULL~: $DAYS_AGO days"$'\n'
            fi

            # Escape for HTML
            LAST_MSG_ESC=$(echo "$LAST_MSG" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')
            DESC_ESC=$(echo "$DESC" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')

            PROJECT_DATA+="${OWNER}|${REPO}|${DESC_ESC}|${CATEGORY}|${STATUS}|${DAYS_AGO}|${LAST_MSG_ESC}|${COMMITS}"$'\n'

            if [ "$FULL" = "$FOCUS_REPO" ]; then
              FOCUS_DAYS="$DAYS_AGO"
              FOCUS_COMMITS="$COMMITS"
            fi

            # Most recent activity ANYWHERE (excluding this repo — its daily bot
            # commits would always read as activity). Lets the nudge tell
            # "busy on another project" apart from "gone quiet entirely".
            if [ "$FULL" != "telemetry/daily" ] && [ "$DAYS_AGO" != "?" ]; then
              if [ "$MIN_DAYS" = "?" ] || [ "$DAYS_AGO" -lt "$MIN_DAYS" ]; then
                MIN_DAYS="$DAYS_AGO"
              fi
            fi
          done

          # If every repo failed to read, the token has the wrong scopes — fail the run
          if [ "$FAILED" -eq "$TOTAL" ]; then
            echo "::error::All $TOTAL repo reads failed — DAILY_TOKEN needs 'repo' scope with access to telemetry and Recreational-Math"
            exit 1
          fi

          if [ "$FOCUS_COMMITS" -gt 0 ] 2>/dev/null; then
            FOCUS_STATE="worked on today ✅"
          elif [ "$FOCUS_DAYS" = "?" ]; then
            FOCUS_STATE="unreadable"
          else
            FOCUS_STATE="idle ${FOCUS_DAYS}d 🔴"
          fi

          ENTRY+=$'\n'"**$ACTIVE/$TOTAL repos active**"$'\n'
          ENTRY+="Focus: **${FOCUS_REPO}** — ${FOCUS_GOAL} — ${FOCUS_STATE}"$'\n'
          if [ "$FAILED" -gt 0 ]; then
            ENTRY+=$'\n'"_${FAILED} repo(s) unreadable — check token scopes_"$'\n'
          fi
          ENTRY+=$'\n---\n'

          # Prepend to monthly log
          if [ -f "$LOG" ]; then
            echo "$ENTRY" | cat - "$LOG" > tmp && mv tmp "$LOG"
          else
            echo "# Activity — $YEAR-$MONTH"$'\n' > "$LOG"
            echo "$ENTRY" >> "$LOG"
          fi

          # Streak tracking
          STREAK_FILE=".streak"
          if [ -f "$STREAK_FILE" ]; then
            LAST_DATE=$(head -1 "$STREAK_FILE")
            LAST_STREAK=$(tail -1 "$STREAK_FILE")
          else
            LAST_DATE=""
            LAST_STREAK=0
          fi

          if [ "$ACTIVE" -gt 0 ]; then
            YESTERDAY=$(date -d "$TODAY - 1 day" +%Y-%m-%d 2>/dev/null)
            if [ "$LAST_DATE" = "$TODAY" ]; then
              NEW_STREAK=$LAST_STREAK
            elif [ "$LAST_DATE" = "$YESTERDAY" ]; then
              NEW_STREAK=$((LAST_STREAK + 1))
            else
              NEW_STREAK=1
            fi
          else
            NEW_STREAK=0
          fi

          echo "$TODAY" > "$STREAK_FILE"
          echo "$NEW_STREAK" >> "$STREAK_FILE"

          # Generate HTML portfolio
          cat > index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Daily — Project Dashboard</title>
            <style>
              :root {
                --bg: #F9F6EE;
                --text: #0a131d;
                --muted: slategray;
                --border: #e5e5e5;
                --active: #3da12a;
                --recent: #52c234;
                --idle: #e6a817;
                --stale: #c0392b;
              }
              @media (prefers-color-scheme: dark) {
                :root {
                  --bg: #0a131d;
                  --text: #E8E4DD;
                  --muted: #8893a2;
                  --border: #2a3545;
                }
              }
              *, *::before, *::after { box-sizing: border-box; margin: 0; }
              body {
                font-family: "Inclusive Sans", -apple-system, BlinkMacSystemFont, sans-serif;
                background: var(--bg);
                color: var(--text);
                max-width: 960px;
                margin: 0 auto;
                padding: 48px 24px;
                line-height: 1.5;
              }
              h1 { font-size: 3rem; font-weight: 200; letter-spacing: -0.03em; margin-bottom: 8px; }
              .subtitle { color: var(--muted); font-size: 1.1rem; font-weight: 300; margin-bottom: 48px; }
              .streak { font-size: 1.5rem; font-weight: 300; margin-bottom: 24px; }
              .streak strong { font-weight: 600; }
              .focus {
                border: 1px solid var(--border);
                border-left: 3px solid var(--idle);
                border-radius: 8px;
                padding: 16px 20px;
                margin-bottom: 48px;
                font-size: 1.05rem;
              }
              .focus-next { color: var(--muted); font-size: 0.85rem; }
              .category { margin-bottom: 40px; }
              .category-label {
                font-size: 0.75rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--muted);
                margin-bottom: 12px;
              }
              .project {
                display: flex;
                align-items: baseline;
                gap: 12px;
                padding: 14px 0;
                border-bottom: 1px solid var(--border);
                text-decoration: none;
                color: var(--text);
                transition: opacity 0.15s;
              }
              .project:hover { opacity: 0.7; }
              .project-name { font-size: 1.25rem; font-weight: 400; }
              .project-owner {
                font-size: 0.65rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--muted);
                border: 1px solid var(--border);
                border-radius: 4px;
                padding: 1px 5px;
                align-self: center;
              }
              .project-desc { font-size: 0.875rem; color: var(--muted); font-weight: 300; flex: 1; }
              .project-status {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                flex-shrink: 0;
              }
              .status-active { background: var(--active); box-shadow: 0 0 6px var(--active); }
              .status-recent { background: var(--recent); }
              .status-idle { background: var(--idle); }
              .status-stale { background: var(--stale); opacity: 0.5; }
              .project-meta {
                font-size: 0.75rem;
                color: var(--muted);
                white-space: nowrap;
              }
              .target {
                flex-shrink: 0;
                align-self: center;
                font-size: 0.9rem;
                opacity: 0.18;
                filter: grayscale(1);
                cursor: pointer;
                transition: opacity 0.15s, filter 0.15s;
              }
              .target:hover { opacity: 1; filter: none; }
              .target.current { opacity: 1; filter: none; cursor: default; }
              #queue { list-style: none; margin: 12px 0 0; padding: 0; counter-reset: q; }
              .qitem {
                display: flex;
                align-items: baseline;
                gap: 10px;
                padding: 8px 4px;
                border-top: 1px dashed var(--border);
                cursor: grab;
                counter-increment: q;
              }
              .qitem::before {
                content: counter(q);
                font-size: 0.7rem;
                color: var(--muted);
                min-width: 1em;
                text-align: right;
              }
              .qitem:first-child .qname { font-weight: 600; }
              .qitem.dragging { opacity: 0.4; }
              .grip { color: var(--muted); cursor: grab; }
              .qname { font-size: 0.95rem; }
              .qgoal { font-size: 0.8rem; color: var(--muted); flex: 1; }
              .qx {
                color: var(--muted);
                cursor: pointer;
                padding: 0 6px;
                opacity: 0.4;
              }
              .qx:hover { opacity: 1; color: var(--stale); }
              #saveorder { display: inline-block; margin-top: 8px; color: var(--idle); text-decoration: none; font-weight: 600; }
              .last-commit {
                font-size: 0.75rem;
                color: var(--muted);
                font-style: italic;
                max-width: 200px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
              }
              .footer {
                margin-top: 48px;
                padding-top: 24px;
                border-top: 1px dashed var(--border);
                font-size: 0.8rem;
                color: var(--muted);
              }
              @media (max-width: 640px) {
                h1 { font-size: 2rem; }
                .project { flex-wrap: wrap; gap: 4px; }
                .project-desc { width: 100%; order: 3; }
                .last-commit { display: none; }
              }
            </style>
          </head>
          <body>
          HTMLEOF

          # Remove leading whitespace
          sed -i 's/^          //' index.html 2>/dev/null || sed -i '' 's/^          //' index.html

          # Build the draggable queue list from focus.json
          QUEUE_HTML=""
          while IFS='|' read -r QREPO QGOAL; do
            [ -z "$QREPO" ] && continue
            QGOAL_ESC=$(echo "$QGOAL" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')
            QUEUE_HTML+="<li class=\"qitem\" draggable=\"true\" data-repo=\"${QREPO}\"><span class=\"grip\">⠿</span><span class=\"qname\">${QREPO##*/}</span><span class=\"qgoal\">${QGOAL_ESC}</span><span class=\"qx\" title=\"Remove from queue\">×</span></li>"
          done < <(jq -r '.queue[] | .repo + "|" + .goal' focus.json)

          # Add dynamic content
          cat >> index.html << EOF
          <h1>Daily</h1>
          <p class="subtitle">Project dashboard for Terry Gillespie</p>
          <p class="streak">Current streak: <strong>${NEW_STREAK} day(s)</strong> &mdash; ${ACTIVE}/${TOTAL} repos active &mdash; ${TODAY}</p>
          <div class="focus">
            🎯 <strong>Now: ${FOCUS_REPO##*/}</strong> &mdash; ${FOCUS_GOAL} &mdash; ${FOCUS_STATE}
            <ol id="queue">${QUEUE_HTML}</ol>
            <a id="saveorder" class="focus-next" hidden href="#">Save new order →</a>
          </div>
          EOF
          sed -i 's/^          //' index.html 2>/dev/null || sed -i '' 's/^          //' index.html

          # Group projects by category
          CATEGORIES=("Apps" "Web" "Creative" "Experiments" "Meta")

          for CAT in "${CATEGORIES[@]}"; do
            echo "<div class=\"category\">" >> index.html
            echo "<div class=\"category-label\">$CAT</div>" >> index.html

            echo "$PROJECT_DATA" | while IFS='|' read -r OWNER REPO DESC CATEGORY STATUS DAYS LASTMSG COMMITS; do
              [ -z "$REPO" ] && continue
              [ "$CATEGORY" != "$CAT" ] && continue

              if [ "$DAYS" = "0" ]; then
                META="today"
              elif [ "$DAYS" = "1" ]; then
                META="yesterday"
              elif [ "$DAYS" = "?" ]; then
                META=""
              else
                META="${DAYS}d ago"
              fi

              if [ "$OWNER" = "Recreational-Math" ]; then
                OWNER_TAG='<span class="project-owner">RM</span>'
              else
                OWNER_TAG=''
              fi

              # Focus tick: current focus glows; ticking any other row opens a
              # prefilled issue that set-focus.yml puts at the top of the queue
              if [ "$OWNER/$REPO" = "$FOCUS_REPO" ]; then
                TARGET='<span class="target current" title="Current focus">🎯</span>'
              else
                TARGET="<span class=\"target\" title=\"Make ${REPO} the focus\" onclick=\"event.preventDefault();event.stopPropagation();window.open('https://github.com/telemetry/daily/issues/new?title=focus%3A+${OWNER}%2F${REPO}&amp;body=Submit%20to%20put%20this%20repo%20at%20the%20top%20of%20the%20focus%20queue.%20Add%20a%20line%20%27goal%3A%20your%20goal%27%20to%20set%20its%20goal.','_blank')\">🎯</span>"
              fi

              cat >> index.html << PROJEOF
          <a class="project" href="https://github.com/${OWNER}/${REPO}" target="_blank" rel="noopener">
            <span class="project-status status-${STATUS}"></span>
            <span class="project-name">${REPO}</span>${OWNER_TAG}
            <span class="project-desc">${DESC}</span>
            <span class="last-commit">${LASTMSG}</span>
            ${TARGET}
            <span class="project-meta">${META}</span>
          </a>
          PROJEOF
            done

            echo "</div>" >> index.html
          done

          cat >> index.html << 'HTMLEOF'
          <div class="footer">
            Auto-updated daily by GitHub Actions. Tick a dim 🎯 to retarget the focus; drag the queue to reorder, then Save.
            <span style="float:right"><span class="project-status status-active" style="display:inline-block;vertical-align:middle"></span> today
            &nbsp; <span class="project-status status-recent" style="display:inline-block;vertical-align:middle"></span> &lt;7d
            &nbsp; <span class="project-status status-idle" style="display:inline-block;vertical-align:middle"></span> &lt;30d
            &nbsp; <span class="project-status status-stale" style="display:inline-block;vertical-align:middle;opacity:0.5"></span> 30d+</span>
          </div>
          <script>
          (function () {
            var list = document.getElementById('queue');
            var save = document.getElementById('saveorder');
            if (!list || !save) return;
            function repos() {
              return Array.prototype.map.call(list.children, function (li) { return li.dataset.repo; });
            }
            var orig = repos().join(',');
            var dragEl = null;
            list.addEventListener('dragstart', function (e) {
              dragEl = e.target.closest('.qitem');
              if (dragEl) dragEl.classList.add('dragging');
            });
            list.addEventListener('dragover', function (e) {
              e.preventDefault();
              var li = e.target.closest('.qitem');
              if (!li || !dragEl || li === dragEl) return;
              var r = li.getBoundingClientRect();
              var after = e.clientY > r.top + r.height / 2;
              list.insertBefore(dragEl, after ? li.nextSibling : li);
            });
            list.addEventListener('drop', function (e) { e.preventDefault(); });
            function refresh() {
              if (dragEl) dragEl.classList.remove('dragging');
              dragEl = null;
              var now = repos().join(',');
              if (now === orig || !now) { save.hidden = true; return; }
              save.hidden = false;
              save.href = 'https://github.com/telemetry/daily/issues/new'
                + '?title=' + encodeURIComponent('queue: ' + now)
                + '&body=' + encodeURIComponent('Reordered from the dashboard. Submit to apply.');
            }
            list.addEventListener('dragend', refresh);
            list.addEventListener('click', function (e) {
              if (e.target.classList.contains('qx')) {
                e.target.closest('.qitem').remove();
                refresh();
              }
            });
          })();
          </script>
          </body>
          </html>
          HTMLEOF
          sed -i 's/^          //' index.html 2>/dev/null || sed -i '' 's/^          //' index.html

          # Update README
          cat > README.md << EOF
          # daily

          Private project dashboard and daily activity tracker.

          Auto-checks repos across telemetry and Recreational-Math daily, logs activity, tracks commit streak.

          **Current streak: ${NEW_STREAK} day(s)** — Last check: ${TODAY}

          See [logs/${YEAR}/${MONTH}.md](logs/${YEAR}/${MONTH}.md) for the daily log.
          EOF
          sed -i 's/^          //' README.md 2>/dev/null || sed -i '' 's/^          //' README.md

          # Expose focus state to the nudge step
          echo "focus_repo=$FOCUS_REPO" >> "$GITHUB_OUTPUT"
          echo "focus_days=$FOCUS_DAYS" >> "$GITHUB_OUTPUT"
          echo "focus_commits=$FOCUS_COMMITS" >> "$GITHUB_OUTPUT"
          echo "min_days=$MIN_DAYS" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "telemetry"
          git config user.email "telemetry@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "$(date -u +%Y-%m-%d) activity check"
          git push

      # Nudge via issue comment when the focus repo goes quiet. Comments come from
      # github-actions[bot], so the @mention emails Terry (self-comments wouldn't).
      # Only nudges when NOTHING has moved for 2+ days — activity on any other
      # project counts as working, and working people don't need nudging.
      - name: Nudge when idle everywhere
        if: steps.report.outputs.focus_commits == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOCUS_REPO: ${{ steps.report.outputs.focus_repo }}
          FOCUS_DAYS: ${{ steps.report.outputs.focus_days }}
          MIN_DAYS: ${{ steps.report.outputs.min_days }}
        run: |
          set -e
          if [ "$FOCUS_DAYS" = "?" ] || [ "$FOCUS_DAYS" -lt 2 ]; then
            echo "No nudge needed (focus idle: $FOCUS_DAYS)"
            exit 0
          fi
          if [ "$MIN_DAYS" != "?" ] && [ "$MIN_DAYS" -lt 2 ]; then
            echo "Actively working elsewhere (most recent activity ${MIN_DAYS}d ago) — no nudge"
            exit 0
          fi
          NAME="${FOCUS_REPO##*/}"
          TITLE="Focus: $NAME"
          NUM=$(gh issue list -R telemetry/daily --state open --search "in:title Focus:" --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            URL=$(gh issue create -R telemetry/daily --title "$TITLE" \
              --body "Tracking the current focus: **${FOCUS_REPO}**. The tracker nudges here when everything goes quiet. Retarget by ticking a 🎯 on the dashboard.")
            NUM="${URL##*/}"
          else
            gh issue edit "$NUM" -R telemetry/daily --title "$TITLE"
          fi
          gh issue comment "$NUM" -R telemetry/daily --body "@telemetry — ${NAME} has had no commits for **${FOCUS_DAYS} days**, and nothing else is moving either. Point the laser. 🔴"
